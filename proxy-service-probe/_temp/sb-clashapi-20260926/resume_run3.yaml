port: 7890
socks-port: 7891
allow-lan: false
mode: rule
log-level: info
ipv6: false
unified-delay: true
tcp-concurrent: true
geodata-mode: true
geox-url:
  geoip: https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip.dat
  geosite: https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geosite.dat
  mmdb: https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/country.mmdb
geo-auto-update: true
geo-update-interval: 24
# TLS 指纹使用节点自己的 client-fingerprint；新版 Mihomo 已移除全局指纹选项。
find-process-mode: strict

# 流量域名嗅探模块（从 TLS/HTTP 流量中提取域名，阻断纯 IP 访问造成的泄露）
sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  override-destination: true
  sniff:
    HTTP:
      ports:
      - 80
      - 8080-8880
      override-destination: true
    TLS:
      ports:
      - 443
      - 8443
    QUIC:
      ports:
      - 443
      - 8443
  skip-domain:
  - Mijia Cloud
  - dlg.io.mi.com
  - +.push.apple.com

# 权威防 DNS 泄露模块（基于 Fake-IP 虚拟映射、分流隔离与代理隧道内加密解析架构）
dns:
  enable: true
  listen: 0.0.0.0:1053
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
  - '*.lan'
  - '*.local'
  - '*.arpa'
  - '*.msftncsi.com'
  - '*.msftconnecttest.com'
  - localhost.ptlogin2.qq.com
  - time.*.com
  - ntp.*.com
  - '*.time.edu.cn'
  - '*.ntp.org.cn'
  - +.pool.ntp.org
  - +.market.xiaomi.com
  - +.push.apple.com
  - +.network-test.debian.org
  - +.bestcf.eu.cc
  cache-algorithm: arc
  use-hosts: true
  use-system-hosts: false
  respect-rules: true

  # 基础引导 DNS（仅用于启动时解析加密 DNS 服务器本身的域名，必须为纯 IP 直连）
  default-nameserver:
  - 223.5.5.5
  - 119.29.29.29

  # 代理节点域名专属解析器（仅用于获取落地节点服务器 IP，纯直连解析，杜绝死锁）
  proxy-server-nameserver:
  - 223.5.5.5
  - 119.29.29.29

  # 直连域名专属 DNS（当连接被判定为 DIRECT 时使用，保证国内访问获得最佳 CDN 延迟）
  direct-nameserver:
  - https://doh.pub/dns-query
  - https://dns.alidns.com/dns-query
  - 223.5.5.5
  - 119.29.29.29

  # 默认境外/未匹配域名解析：100% 走【🌏️ 节点选择】代理隧道，本地运营商 0 记录（杜绝国内并发抢答泄露）
  nameserver:
  - https://8.8.8.8/dns-query#🌏️ 节点选择
  - https://1.1.1.1/dns-query#🌏️ 节点选择

  # 精准策略分流（优先于 nameserver 生效）：国内域名与私有域走国内加密 DoH
  nameserver-policy:
    geosite:private:
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query
    geosite:cn:
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query

