interface:
  display_name: "SRT Subtitle Translate"
  short_description: "Translate SRT subtitles into concise Simplified Chinese"
  default_prompt: "Use $srt-subtitle-translate to translate this SRT into concise Simplified Chinese directly in the current conversation. First do a full-file consistency pass for names and terminology, optionally create a temporary glossary, then if the file is long split it into stable chunks and keep translating chunk by chunk with the same term decisions until the final `-CN` file is written. Treat the preprocessed English cue boundaries as canonical: Chinese may optimize phrasing and word order inside each cue, but must not merge, split, or redistribute text across adjacent cues unless the user explicitly asks for another resegmentation pass. Do not suggest or depend on any external translation service; use only the current conversation, local helper scripts, and Codex subagents only when they are explicitly permitted."
